<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Template placeholder. The top face of the PCFHub mark on its own: one
       component rather than the whole stack.

       Geometry, ramp and inner diamond are the original's verbatim, shifted
       down 19 so a face that sits at the top of the full mark is centred when
       it stands alone. The gradient is declared in userSpaceOnUse, so its
