<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A calendar carrying a range: two chosen days with the band between them,
       which is the one thing this control does that a pair of date fields does
       not.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family
       rather than beside it. It is declared in userSpaceOnUse and spans the
       whole 96 canvas, so the card samples the part of the ramp it sits on and
       the mark reads as one object lit from the top right.

       Drawn for 32px, which is the size it is nearly always seen at, and the
       two earlier attempts are why. Two circles on a white sheet became a face.
       A pale band between two solid ends, also on a white sheet, put three
       weights inside an area that is thirteen pixels tall at 32 and the band
       simply vanished. This is white on the gradient instead: two weights, the
       highest contrast available, and no inner sheet to spend room on.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="range-ramp" x1="8" y1="80" x2="88" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>

  <!-- The two hangers, drawn first so the card's corner radius overlaps them.
       They are most of what says "calendar" once the mark is small. -->
  <rect x="28" y="4" width="10" height="20" rx="5" fill="#8A7BFF"/>
  <rect x="58" y="4" width="10" height="20" rx="5" fill="#33A8FF"/>

  <!-- The card. -->
  <rect x="8" y="14" width="80" height="74" rx="18" fill="url(#range-ramp)"/>

  <!-- The header rule, which separates the hangers from the range and is the
       second thing that says "calendar". -->
  <rect x="20" y="36" width="56" height="4" rx="2" fill="#F8FAFC" fill-opacity="0.45"/>

  <!-- The band between the two chosen days. -->
  <rect x="20" y="52" width="56" height="20" rx="10" fill="#F8FAFC" fill-opacity="0.42"/>

  <!-- The two chosen days: the ends of that same pill, rounded outward only,
       exactly as the calendar rounds the start and end of a selection. -->
  <path d="M40 52 H30 A10 10 0 0 0 30 72 H40 Z" fill="#F8FAFC"/>
  <path d="M56 52 H66 A10 10 0 0 1 66 72 H56 Z" fill="#F8FAFC"/>
</svg>
