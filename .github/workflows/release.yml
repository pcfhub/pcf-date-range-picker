name: Release

# A pushed tag is the whole trigger. PCFHub's contract is that tagging a
# component repository publishes a documented version on the hub with no manual
# steps, and this workflow is the half of that contract living here.
#
# The steps live in pcfhub/_template's reusable workflow. They used to live here
# as a copy of the same ~130 lines every component repository carried, and the
# copy had drifted: it asked GitHub to generate release notes even when
# re-dispatching a tag that already had them, which appends a second set rather
# than replacing the first — and the hub imports release notes into the
# published changelog, so a duplicate here is a duplicate on the component page.
#
# None of that was a decision. It is what the copy that stopped receiving the
# fixes the others got always becomes.
#
# Pinned to @v1 rather than @main — a release build is the last place to want an
# unannounced change.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: pcfhub/_template/.github/workflows/release-reusable.yml@v1
    with:
      control-dir: DateRangePicker
      solution-dir: Solution
      tag: ${{ github.event.inputs.tag }}
